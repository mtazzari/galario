name: tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.7, 3.8, 3.9, '3.12', '3.13', '3.14']
    env:
      OMP_NUM_THREADS: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup conda for Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: test
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          allow-softlinks: true
          channel-priority: flexible
          show-channel-urls: true
      - name: Print conda config
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
      - name: Install FFTW3
        run: sudo apt-get install libfftw3-dev
      - name: Build and install galario
        run: |
          conda activate test
          conda install cython nomkl numpy pytest scipy
          pip install coverage pytest-cov
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/tmp -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" ..
          make
          make install
      - name: Run unit tests
        run: python/py.test.sh -sv --cov=./ --cov-report=xml:coverage.xml python/test_galario.py
        working-directory: build
      - name: Upload code coverage report
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: ./build/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
